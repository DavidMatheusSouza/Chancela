name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: package.json's packageManager field names it, and the
      # action refuses to run when two places disagree about which pnpm to use.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - run: pnpm install --no-frozen-lockfile
      # The Prisma client is generated code, not a dependency: without this the
      # web app's types do not exist yet. It needs the schema, not a database.
      - run: pnpm db:generate
      # chancela-check imports chancela-sdk as a package, and a package's types
      # are its dist/, which is gitignored. Build it the way npm would see it.
      - name: Build the SDK
        run: pnpm --filter chancela-sdk build
      - name: Typecheck
        run: pnpm -r --filter '!@chancela/contracts' typecheck
      - name: Unit and integration tests
        run: pnpm -r --filter '!@chancela/contracts' test
      - name: Security suite
        run: pnpm --filter @chancela/policy-engine test:security
      - name: Build
        run: pnpm --filter @chancela/web build
        env:
          # Anvil deterministic account #1 -- a published test vector, not a secret.
          ATTESTATION_PRIVATE_KEY: '0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d'

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1

      # packages/contracts/lib is gitignored, so nothing arrives with the
      # checkout. Versions are pinned rather than floating: `forge build`
      # silently picking up a new OpenZeppelin major would fail here for a
      # reason that has nothing to do with the change being tested.
      - name: Install pinned dependencies
        run: |
          forge install foundry-rs/forge-std@v1.9.4 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
        working-directory: packages/contracts

      - name: Build
        run: forge build
        working-directory: packages/contracts
      - name: Test
        run: forge test -vvv
        working-directory: packages/contracts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
