name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm -r --filter '!@trustagent/contracts' typecheck
      - name: Unit and integration tests
        run: pnpm -r --filter '!@trustagent/contracts' test
      - name: Security suite
        run: pnpm --filter @trustagent/policy-engine test:security
      - name: Build
        run: pnpm --filter @trustagent/web build
        env:
          # Anvil deterministic account #1 -- a published test vector, not a secret.
          ATTESTATION_PRIVATE_KEY: '0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d'

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build
        working-directory: packages/contracts
      - name: Test
        run: forge test -vvv
        working-directory: packages/contracts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
