name: Publish chancela-check

# Pushing a tag named chancela-check-v<version> stages that version on npm;
# it goes public once a maintainer approves it (with 2FA) on npmjs.com.
# No token anywhere: npm trusts this workflow in this repository (trusted
# publishing, OIDC), and the package gets a provenance statement linking the
# tarball to the commit and the run that built it.
on:
  push:
    tags: ['chancela-check-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --no-frozen-lockfile
      # The tests import the SDK as a package; its types are its dist/.
      - run: pnpm --filter chancela-sdk build

      - name: The tag names the version being published
        working-directory: packages/check
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "chancela-check-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: pnpm --filter chancela-check typecheck
      - run: pnpm --filter chancela-check test
      - run: pnpm --filter chancela-check build

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      # Staged, not published: the version waits on npmjs.com until a
      # maintainer approves it with 2FA. The trust relationship for this
      # workflow only grants stage-publish.
      - name: Stage for publishing
        working-directory: packages/check
        run: npm stage publish --access public --provenance
