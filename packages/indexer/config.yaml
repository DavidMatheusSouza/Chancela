# Envio HyperIndex configuration.
#
# Indexes TrustAgentPolicyRegistry events off Monad into a GraphQL API. The
# Trust Activity Explorer reads this, not our own database -- which is the
# point: the explorer shows what the chain says, independently of the service
# that produced it.

name: chancela
description: Authorization decisions and policy anchors for AI agents on Monad

# Note: the public Monad testnet RPC silently caps eth_getLogs block ranges.
# A 3000-block query returns nothing while a 30-block query works, so the
# indexer must page in small windows rather than backfill in one sweep.
networks:
  - id: 10143 # Monad testnet. Use 143 for mainnet.
    start_block: 63933400 # contracts deployed here; no point scanning earlier
    contracts:
      - name: TrustAgentPolicyRegistry
        address:
          - "0x649DD58756Ee9a4b65D8d9fd2D5Aa68097d36d4b"
        handler: src/handlers.ts
        events:
          - event: PolicyAnchored(uint256 indexed agentTokenId, uint32 indexed version, bytes32 policyHash, address owner, uint64 anchoredAt)
          - event: DecisionRecorded(uint256 indexed agentTokenId, bytes32 indexed decisionHash, bytes4 indexed action, uint8 decision, uint8 risk, bytes32 intentHash, bytes32 policyHash, uint64 recordedAt)
          - event: AgentSuspended(uint256 indexed agentTokenId, bytes32 reasonCode, uint64 at)
          - event: AgentReactivated(uint256 indexed agentTokenId, uint64 at)
          - event: AttestorSet(uint256 indexed agentTokenId, address indexed attestor, address indexed setBy)
