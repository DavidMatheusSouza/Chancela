# Chancela local stack.
#
# The database is namespaced and bound to its own volume so it cannot collide
# with anything else on a shared host.

services:
  db:
    image: postgres:16-alpine
    container_name: chancela-db
    environment:
      POSTGRES_USER: chancela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chancela}
      POSTGRES_DB: chancela
    volumes:
      - chancela-pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-5442}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chancela -d chancela']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: chancela-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chancela:${POSTGRES_PASSWORD:-chancela}@db:5432/chancela
      ATTESTATION_PRIVATE_KEY: ${ATTESTATION_PRIVATE_KEY}
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-10143}
      MONAD_RPC_URL: ${MONAD_RPC_URL:-https://testnet-rpc.monad.xyz}
      POLICY_REGISTRY_ADDRESS: ${POLICY_REGISTRY_ADDRESS:-}
      ERC8004_IDENTITY_REGISTRY: ${ERC8004_IDENTITY_REGISTRY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      NANSEN_API_KEY: ${NANSEN_API_KEY:-}
      ENVIO_GRAPHQL_URL: ${ENVIO_GRAPHQL_URL:-}
      PORT: 3080
    ports:
      - '127.0.0.1:${WEB_PORT:-3080}:3080'
    restart: unless-stopped

volumes:
  chancela-pgdata:
    name: chancela-pgdata
